name: Install ScrimForge V5 Updates

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Registration Update
        if: hashFiles('ScrimForge-V5-FreeFire-Registration-Simple.zip') != ''
        run: |
          rm -rf _update
          mkdir _update

          unzip -q "ScrimForge-V5-FreeFire-Registration-Simple.zip" -d _update

          ROOT="_update/ScrimForge-V5-COMPLETE"

          cp -R "$ROOT"/. .

          rm -rf _update
          rm -f "ScrimForge-V5-FreeFire-Registration-Simple.zip"

      - name: Commit Update
        if: hashFiles('ScrimForge-V5-FreeFire-Registration-Simple.zip') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --cached --quiet || git commit -m "Update simple Free Fire registration"

          git push
