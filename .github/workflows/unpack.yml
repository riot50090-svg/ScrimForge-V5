name: Install ScrimForge V5 Clean

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for clean package
        id: check
        run: |
          if [ -f "ScrimForge-V5-CLEAN.zip" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract clean V5
        if: steps.check.outputs.found == 'true'
        run: |
          rm -rf _scrimforge_extract
          mkdir _scrimforge_extract

          unzip -q "ScrimForge-V5-CLEAN.zip" -d _scrimforge_extract

          ROOT="_scrimforge_extract/ScrimForge-V5-COMPLETE"

          cp -R "$ROOT"/. .

          rm -rf _scrimforge_extract
          rm -f "ScrimForge-V5-CLEAN.zip"

          # Never replace the GitHub Actions workflow itself
          git restore .github/workflows/unpack.yml

      - name: Commit extracted V5
        if: steps.check.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install clean ScrimForge V5"
            git push
          fi
